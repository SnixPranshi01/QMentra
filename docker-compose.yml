services:
  postgres:
    image: postgres:17-alpine
    container_name: qmentra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qmentra
      POSTGRES_USER: qmentra
      POSTGRES_PASSWORD: qmentra-local
    ports:
      - "5433:5432"
    volumes:
      - qmentra-postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmentra -d qmentra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qmentra-postgres-data: